# promtool 로 실행하는 시계열 시험. 수신자·외부 서버에 연결하지 않는다.
rule_files:
  - /etc/prometheus/alerts.yaml
evaluation_interval: 1m
tests:
  # 수집 주소가 UP 이어도 한 서버의 실제 루트 디스크 지표가 없으면 알린다.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="ai"}'
        values: '1+0x15'
      - series: 'up{job="langfuse-node",instance="langfuse"}'
        values: '1+0x15'
      - series: 'node_memory_MemTotal_bytes{job="node-exporter",instance="ai"}'
        values: '1000+0x15'
      - series: 'node_memory_MemTotal_bytes{job="langfuse-node",instance="langfuse"}'
        values: '1000+0x15'
      - series: 'node_filesystem_size_bytes{job="node-exporter",instance="ai",mountpoint="/",fstype="ext4"}'
        values: '1000+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeHostMetricsMissing
        exp_alerts:
          - exp_labels: {job: langfuse-node, instance: langfuse, severity: warning}
            exp_annotations: {summary: '호스트 메모리·루트 디스크 지표 누락: langfuse'}
  # 과거 실패는 남아 있어도, 가장 최근 실행에 성공하면 실패 알림이 해제돼야 한다.
  - interval: 1m
    input_series:
      - series: 'kube_job_created{namespace="ai-app",job_name="run-trend-old"}'
        values: '100+0x20'
      - series: 'kube_job_owner{namespace="ai-app",job_name="run-trend-old",owner_name="run-trend",owner_kind="CronJob",owner_is_controller="true"}'
        values: '1+0x20'
      - series: 'kube_job_failed{namespace="ai-app",job_name="run-trend-old",condition="true"}'
        values: '1+0x20'
      - series: 'kube_job_created{namespace="ai-app",job_name="run-trend-new"}'
        values: '_ _ _ _ _ 500+0x15'
      - series: 'kube_job_owner{namespace="ai-app",job_name="run-trend-new",owner_name="run-trend",owner_kind="CronJob",owner_is_controller="true"}'
        values: '_ _ _ _ _ 1+0x15'
      - series: 'kube_job_failed{namespace="ai-app",job_name="run-trend-new",condition="true"}'
        values: '_ _ _ _ _ 0+0x4 1+0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: CronJobLatestFailed
        exp_alerts:
          - exp_labels: {namespace: ai-app, job_name: run-trend-old, condition: 'true', severity: critical}
            exp_annotations: {summary: '정기 작업의 최신 실행 실패: ai-app/run-trend-old'}
      - eval_time: 7m
        alertname: CronJobLatestFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: CronJobLatestFailed
        exp_alerts:
          - exp_labels: {namespace: ai-app, job_name: run-trend-new, condition: 'true', severity: critical}
            exp_annotations: {summary: '정기 작업의 최신 실행 실패: ai-app/run-trend-new'}
  # 복원 등으로 의도적으로 중지한 작업에는 예약 지연 알림을 보내지 않는다.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_next_schedule_time{namespace="ai-app",cronjob="active"}'
        values: '0+0x35'
      - series: 'kube_cronjob_next_schedule_time{namespace="ai-app",cronjob="suspended"}'
        values: '0+0x35'
      - series: 'kube_cronjob_spec_suspend{namespace="ai-app",cronjob="active"}'
        values: '0+0x35'
      - series: 'kube_cronjob_spec_suspend{namespace="ai-app",cronjob="suspended"}'
        values: '1+0x35'
    alert_rule_test:
      - eval_time: 30m
        alertname: CronJobScheduleOverdue
        exp_alerts:
          - exp_labels: {namespace: ai-app, cronjob: active, severity: warning}
            exp_annotations: {summary: '정기 작업 실행이 예정 시각보다 늦습니다: active'}
  # 한 번도 성공하지 않은 작업도 누락하지 않는다.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ai-data",cronjob="pg-backup"}'
        values: '1000+0x180'
      - series: 'kube_cronjob_created{namespace="ai-data",cronjob="pg-backup"}'
        values: '0+0x180'
      - series: 'kube_cronjob_spec_suspend{namespace="ai-data",cronjob="pg-backup"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 2h30m
        alertname: CronJobNoRecentSuccess
        exp_alerts:
          - exp_labels: {namespace: ai-data, cronjob: pg-backup, severity: warning}
            exp_annotations: {summary: '최근 정기 실행에 2시간 넘게 성공 기록이 없습니다: pg-backup'}
  - interval: 1m
    input_series:
      - series: 'probe_success{job="services",instance="http://agent"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: AiServiceUnavailable
        exp_alerts:
          - exp_labels: {job: services, instance: 'http://agent', severity: critical}
            exp_annotations: {summary: 'AI 구성 요소에 연결할 수 없습니다: http://agent'}
