# Let's Encrypt 인증서 발급처 2개 — HTTPS 인증서를 무료로 자동 발급·갱신받는다.
#
# 전제: cert-manager 가 먼저 설치돼 있어야 한다(문서 05-외부-공개). 이 종류(ClusterIssuer)는 cert-manager 가 추가한 것이다.
# 방식: HTTP-01 — Let's Encrypt 가 http://<도메인>/.well-known/acme-challenge/… 로 직접 접속해 도메인 주인인지 확인한다.
#       그래서 AWS 보안 그룹이 80 번 포트를 인터넷 전체에 열어 두어야 발급·갱신(약 60일마다)이 된다.
#   letsencrypt-staging : 연습용. 횟수 제한이 느슨하지만 브라우저가 신뢰하지 않는 인증서가 나온다. 설정 확인에 쓴다.
#   letsencrypt-prod    : 실제용. 횟수 제한이 엄격하다(같은 도메인 실패가 쌓이면 한동안 발급이 막힌다).
# 어느 것을 쓸지는 site.env 의 CLUSTER_ISSUER 가 정한다(41-ingress.yaml 이 읽는다).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key   # Let's Encrypt 계정 키를 보관할 Secret (cert-manager 가 만든다)
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
